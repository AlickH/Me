  <script>

      closeDetailArrow: document.getElementById("closeDetailArrow"),

      detailContent: document.getElementById("detailContent"),

      postDotPause: 280,
      cursorTopplePause: 320,
      cursorToppleDuration: 980,
      cursorCurlDuration: 980,
      firstBounceDuration: 1170,
      secondBounceDuration: 1050,
      introDelay: 140
    };

    const detailContentByLanguage = {
      en: {

        sections: [
          {

              { year: "2016", title: "Construction Crew", body: "Zhenjiang Guangda Construction Company" },

            ]

              { year: "2025", title: "Linshan Yayuan Phase IV Indemnificatory Housing Project" },

              { year: "2018", title: "Lishui Development Zone Comprehensive Infrastructure PPP Project" },
              { year: "2017", title: "6×3000 Ton Silo Construction Project" },

              { year: "2014", title: "Wuxi Wanda Cultural Tourism City Project" },

            ]

            ]
          }
        ]
      },
      zh: {
        kicker: "Alick Huang",
        introTitle: "只是偶然来了一趟世间",
        sections: [
          {
            id: "experience",
            label: "工作经历",
            items: [
              { year: "现在", title: "项目技术主管", body: "中建五局华东建设江苏分公司" },
              { year: "2019", title: "项目技术员", body: "中建五局华东建设江苏分公司" },
              { year: "2018", title: "质量工程师", body: "中建五局华东建设江苏分公司" },
              { year: "2016", title: "施工员", body: "镇江市光大建筑工程有限公司" },
              { year: "2015", title: "监测员", body: "江西省勘察设计研究院苏州分院" },
              { year: "2014", title: "资料员", body: "中建八局第三建设有限公司" },
              { year: "2011", title: "施工员", body: "山东电力建设第三工程公司" }
            ]
          },
          {
            id: "projects",
            label: "项目经验",
            items: [
              { year: "2025", title: "林山雅苑四期保障性住房项目" },
              { year: "2022", title: "南京智能制造产业园中山湖自主创新国际社区工程总承包项目" },
              { year: "2018", title: "南京桥林街道中心城区保障房项目" },
              { year: "2018", title: "溧水开发区综合基础设施PPP项目" },
              { year: "2017", title: "益海(泰州)粮油工业有限公司6×3000吨粕库筒仓项目工程" },
              { year: "2015", title: "常州地铁一号线建设工程" },
              { year: "2014", title: "无锡万达文化旅游城建设工程" },
              { year: "2011", title: "国电库车发电有限公司二期(2×330MW)扩建工程" }
            ]
          },
          {
            id: "education",
            label: "教育经历",
            items: [
              { year: "2007", title: "土木工程", body: "江苏大学" }
            ]
          }
        ]
      }
    };

    const themeMedia = window.matchMedia("(prefers-color-scheme: dark)");
    const compactContactMedia = window.matchMedia("(max-width: 820px) and (hover: none) and (pointer: coarse)");

    const siteState = {
      detailLanguage: window.localStorage.getItem("detailLanguage") || "en",
      siteTheme: savedSiteTheme || ""
    };

    const heroState = {
      streamNodes: [],
      sequenceId: 0,
      animationComplete: false,
      settled: false,
      visibleDotCount: 0,
      textNodeCount: 0
    };

    const detailState = {
      returnFocus: null,
      openedAt: 0,
      motion: null,
      heroMotion: null
    };

    function currentDetailContent() {
      return detailContentByLanguage[siteState.detailLanguage];
    }

    function createTimelineItem(item) {
      const article = document.createElement("article");
      article.className = "timeline-item";

      const year = document.createElement("p");
      year.className = "timeline-year";
      year.textContent = item.year;
      article.appendChild(year);

      const copy = document.createElement("div");
      copy.className = "timeline-copy";

      const title = document.createElement("h2");
      title.textContent = item.title;
      copy.appendChild(title);

      if (item.body) {
        const body = document.createElement("p");
        body.textContent = item.body;
        copy.appendChild(body);
      }

      article.appendChild(copy);
      return article;
    }

    function renderDetailSections() {
      const content = currentDetailContent();
      const fragment = document.createDocumentFragment();

      els.detailKicker.textContent = content.kicker;
      els.detailIntroTitle.textContent = content.introTitle;

      for (const sectionData of content.sections) {
        const section = document.createElement("section");
        section.className = "detail-section";
        section.id = sectionData.id;

        const label = document.createElement("p");
        label.className = "section-label";
        label.textContent = sectionData.label;
        section.appendChild(label);

        const timeline = document.createElement("div");
        timeline.className = "timeline";

        for (const item of sectionData.items) {
          timeline.appendChild(createTimelineItem(item));
        }

        section.appendChild(timeline);
        fragment.appendChild(section);
      }

      els.detailSections.replaceChildren(fragment);
    }

    function syncLanguageControls() {
      const language = siteState.detailLanguage;
      els.langEn.classList.toggle("active", language === "en");
      els.langZh.classList.toggle("active", language === "zh");
      els.langEn.setAttribute("aria-pressed", language === "en" ? "true" : "false");
      els.langZh.setAttribute("aria-pressed", language === "zh" ? "true" : "false");
      els.languageToggle.dataset.active = language;
      els.languageToggle.setAttribute("aria-label", language === "en" ? "Switch language to Chinese" : "切换到英文");
    }

    function applyDetailLanguage(language) {
      siteState.detailLanguage = language;
      els.detailContent.setAttribute("lang", language);
      window.localStorage.setItem("detailLanguage", language);
      renderDetailSections();
      syncLanguageControls();
      fitIntroTitle();
    }

    function chooseDetailLanguage(language, event) {
      event.stopPropagation();
      if (siteState.detailLanguage === language) {
        return;
      }
      applyDetailLanguage(language);
    }

    function fitIntroTitle() {
      if (window.innerWidth <= 820) {
        els.detailIntroTitle.style.removeProperty("--intro-fit-size");
        return;
      }

      els.detailIntroTitle.style.removeProperty("--intro-fit-size");
      const style = window.getComputedStyle(els.detailIntroTitle);
      const maxSize = parseFloat(style.fontSize);
      const minSize = parseFloat(siteState.detailLanguage === "zh" ? "29.6" : "32");
      const availableWidth = els.detailIntroTitle.parentElement.clientWidth;

      let low = minSize;
      let high = maxSize;
      for (let index = 0; index < 12; index += 1) {
        const mid = (low + high) / 2;
        els.detailIntroTitle.style.setProperty("--intro-fit-size", `${mid}px`);
        if (els.detailIntroTitle.scrollWidth <= availableWidth) {
          low = mid;
        } else {
          high = mid;
        }
      }

      els.detailIntroTitle.style.setProperty("--intro-fit-size", `${low}px`);
    }

    function resolvedTheme() {
      return siteState.siteTheme || (themeMedia.matches ? "dark" : "light");
    }

    function applySiteTheme(theme) {
      siteState.siteTheme = theme;
      if (theme) {
        document.documentElement.dataset.theme = theme;
        window.sessionStorage.setItem("siteTheme", theme);
      } else {
        delete document.documentElement.dataset.theme;
        window.sessionStorage.removeItem("siteTheme");
      }

      const activeTheme = resolvedTheme();
      els.themeToggle.dataset.icon = activeTheme === "dark" ? "sun" : "moon";
      els.themeToggle.setAttribute("aria-label", activeTheme === "dark" ? "Switch to light mode" : "Switch to dark mode");
      els.themeColorMeta.setAttribute("content", activeTheme === "dark" ? "#000000" : "#f3f0e8");
    }

    function themeTransitionGeometry(trigger) {
      const rect = trigger ? trigger.getBoundingClientRect() : {
        left: window.innerWidth / 2,
        top: window.innerHeight / 2,
        width: 0,
        height: 0
      };
      const x = rect.left + rect.width / 2;
      const y = rect.top + rect.height / 2;
      const radius = Math.hypot(
        Math.max(x, window.innerWidth - x),
        Math.max(y, window.innerHeight - y)
      );

      document.documentElement.style.setProperty("--theme-transition-x", `${x}px`);
      document.documentElement.style.setProperty("--theme-transition-y", `${y}px`);
      document.documentElement.style.setProperty("--theme-transition-radius", `${radius}px`);
    }

    async function switchSiteTheme(nextTheme, trigger) {
      themeTransitionGeometry(trigger);

      if (!document.startViewTransition || window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        applySiteTheme(nextTheme);
        return;
      }

      const transition = document.startViewTransition(function () {
        applySiteTheme(nextTheme);
      });
      await transition.finished;
    }

    async function toggleSiteTheme(event) {
      event.stopPropagation();
      await switchSiteTheme(resolvedTheme() === "dark" ? "light" : "dark", event.currentTarget);
    }

    function setContactExpanded(expanded) {
      els.contactIcons.classList.toggle("expanded", expanded);
      els.contactMore.setAttribute("aria-expanded", expanded ? "true" : "false");
    }

    function syncResponsiveControls() {
      fitIntroTitle();
      if (!compactContactMedia.matches) {
        setContactExpanded(true);
        return;
      }

      if (!document.body.classList.contains("detail-open")) {
        setContactExpanded(false);
      }
    }

    function currentText() {
      return window.innerWidth <= 640 ? HERO_TEXT.mobile : HERO_TEXT.desktop;
    }

    function syncMeasureLine() {
      const lines = currentText().split("\n");
      els.measureStart.textContent = lines[0] || "A";
      els.measureLead.innerHTML = lines.length > 1
        ? `<br>${lines.slice(1).join("\n").replace(/\n/g, "<br>")}`
        : "";
    }

    function buildTypingNodes() {
      const nodes = [];
      els.typedStream.replaceChildren();

      for (const char of currentText()) {
        let node;

        if (char === "\n") {
          node = document.createElement("br");
        } else {
          node = document.createElement("span");
          node.className = "typed-char";
          node.textContent = char === " " ? "\u00a0" : char;
        }

        node.classList.add("pending");
        els.typedStream.appendChild(node);
        nodes.push(node);
      }

      heroState.textNodeCount = nodes.length;

      for (let index = 0; index < 2; index += 1) {
        const dot = document.createElement("span");
        dot.className = "typed-char ghost-dot pending";
        dot.textContent = ".";
        els.typedStream.appendChild(dot);
        nodes.push(dot);
      }

      els.finalDot.className = "typed-char ghost-dot pending";
      els.finalDot.textContent = ".";
      heroState.streamNodes = nodes;
    }

    function revealNode(node) {
      node.classList.remove("pending");
    }

    function clearText() {
      buildTypingNodes();
      syncMeasureLine();
      hideCursor();
      heroState.visibleDotCount = 0;
      els.finalDot.classList.add("pending");
      els.dotPoint1.classList.remove("visible");
      els.dotPoint1.removeAttribute("style");
      els.dotPoint2.classList.remove("visible");
      els.dotPoint2.removeAttribute("style");
      els.dotTail.classList.remove("visible");
      els.dotTail.removeAttribute("style");
      els.dotActor.classList.remove("visible");
      els.dotActor.removeAttribute("style");
      els.openDetailArrow.classList.remove("visible");
      syncCursorGeometry();
    }

    function showCursor() {
      syncCursorGeometry();
      els.cursor.classList.add("visible");
    }

    function hideCursor() {
      els.cursor.classList.remove("visible");
    }

    function sleep(ms) {
      return new Promise(function (resolve) {
        window.setTimeout(resolve, ms);
      });
    }

    function nextFrame() {
      return new Promise(function (resolve) {
        window.requestAnimationFrame(function () {
          resolve();
        });
      });
    }

    function easeOutCubic(value) {
      return 1 - Math.pow(1 - value, 3);
    }

    function easeInCubic(value) {
      return value * value * value;
    }

    function easeOutQuad(value) {
      return 1 - (1 - value) * (1 - value);
    }

    function lerp(start, end, progress) {
      return start + (end - start) * progress;
    }

    function animateProgress(duration, draw, easing) {
      return new Promise(function (resolve) {
        const start = performance.now();

        function step(now) {
          const raw = Math.min((now - start) / duration, 1);
          const progress = easing ? easing(raw) : raw;
          draw(progress, raw);

          if (raw < 1) {
            window.requestAnimationFrame(step);
            return;
          }

          resolve();
        }

        window.requestAnimationFrame(step);
      });
    }

    async function blinkCursor(times, keepVisible, duration) {
      const activeDuration = duration || HERO_TIMING.blinkDuration;

      for (let count = 0; count < times; count += 1) {
        showCursor();
        await sleep(activeDuration / 2);
        hideCursor();
        await sleep(activeDuration / 2);
      }

      if (keepVisible) {
        showCursor();
      }
    }

    function lineRect() {
      return {
        left: 0,
        top: 0,
        width: els.heroLine.clientWidth,
        height: els.heroLine.clientHeight
      };
    }

    function localBox(element) {
      const left = element.offsetLeft;
      const top = element.offsetTop;
      const width = element.offsetWidth;
      const height = element.offsetHeight;
      return {
        left,
        top,
        width,
        height,
        right: left + width,
        bottom: top + height
      };
    }

    function referenceRect() {
      const visibleChars = els.typedStream.querySelectorAll(".typed-char:not(.pending)");
      if (visibleChars.length > 0) {
        return localBox(visibleChars[visibleChars.length - 1]);
      }

      const lineBox = lineRect();
      const measureBox = localBox(els.measureStart);
      if (window.innerWidth <= 640) {
        return {
          right: measureBox.left,
          top: measureBox.top,
          height: measureBox.height
        };
      }

      return {
        right: lineBox.left + lineBox.width / 2,
        top: measureBox.top,
        height: measureBox.height
      };
    }

    function syncCursorGeometry() {
      const refBox = referenceRect();
      const topExtension = 8;
      const bottomExtension = 2;
      els.cursor.style.left = `${refBox.right - 0.2}px`;
      els.cursor.style.top = `${refBox.top - topExtension}px`;
      els.cursor.style.height = `${refBox.height + topExtension + bottomExtension}px`;
    }

    function glyphMetricsForChar(char) {
      const style = window.getComputedStyle(els.heroLine);
      const fontSize = Number.parseFloat(style.fontSize);
      const lineHeight = Number.parseFloat(style.lineHeight);
      const scale = 8;
      const padding = Math.ceil(fontSize * scale);
      const canvas = document.createElement("canvas");
      const context = canvas.getContext("2d");
      const font = `${style.fontStyle} ${style.fontWeight} ${fontSize * scale}px ${style.fontFamily}`;
      context.font = font;

      const metrics = context.measureText(char);
      const baseline = ((lineHeight * scale) - metrics.fontBoundingBoxAscent - metrics.fontBoundingBoxDescent) / 2 + metrics.fontBoundingBoxAscent;
      canvas.width = Math.ceil(metrics.width) + padding * 2;
      canvas.height = Math.ceil(lineHeight * scale) + padding * 2;

      const paint = canvas.getContext("2d");
      paint.fillStyle = "#000";
      paint.font = font;
      paint.textBaseline = "alphabetic";
      paint.fillText(char, padding, padding + baseline);

      const pixels = paint.getImageData(0, 0, canvas.width, canvas.height).data;
      let minX = canvas.width;
      let minY = canvas.height;
      let maxX = -1;
      let maxY = -1;

      for (let y = 0; y < canvas.height; y += 1) {
        for (let x = 0; x < canvas.width; x += 1) {
          if (pixels[(y * canvas.width + x) * 4 + 3] <= 8) {
            continue;
          }

          if (x < minX) {
            minX = x;
          }
          if (y < minY) {
            minY = y;
          }
          if (x > maxX) {
            maxX = x;
          }
          if (y > maxY) {
            maxY = y;
          }
        }
      }

      return {
        inkTop: (minY - padding) / scale,
        inkHeight: (maxY - minY + 1) / scale
      };
    }

    function dotGeometry() {
      const style = window.getComputedStyle(els.heroLine);
      const fontSize = Number.parseFloat(style.fontSize);
      const textGlyph = glyphMetricsForChar("n");
      const lastTextRect = localBox(heroState.streamNodes[heroState.textNodeCount - 1]);
      const textRect = localBox(els.measureDot1);
      const size = fontSize * 0.12;
      const gap = size * 0.45;
      const mobileDotDrop = window.innerWidth <= 640 ? size * 0.18 : 0;
      const top = textRect.top + textGlyph.inkTop + textGlyph.inkHeight - size + mobileDotDrop;
      const centerY = top + size / 2;

      const first = {
        left: lastTextRect.right + gap,
        top,
        size
      };
      first.centerX = first.left + size / 2;
      first.centerY = centerY;

      const second = {
        left: first.left + size + gap,
        top,
        size
      };
      second.centerX = second.left + size / 2;
      second.centerY = centerY;

      const third = {
        left: second.left + size + gap,
        top,
        size
      };
      third.centerX = third.left + size / 2;
      third.centerY = centerY;

      return { first, second, third };
    }

    function placeDot(element, geometry) {
      element.style.left = `${geometry.left}px`;
      element.style.top = `${geometry.top}px`;
      element.style.width = `${geometry.size}px`;
      element.style.height = `${geometry.size}px`;
    }

    function positionStaticDots() {
      const geometry = dotGeometry();

      if (heroState.visibleDotCount >= 1) {
        placeDot(els.dotPoint1, geometry.first);
        els.dotPoint1.classList.add("visible");
      } else {
        els.dotPoint1.classList.remove("visible");
        els.dotPoint1.removeAttribute("style");
      }

      if (heroState.visibleDotCount >= 2) {
        placeDot(els.dotPoint2, geometry.second);
        els.dotPoint2.classList.add("visible");
      } else {
        els.dotPoint2.classList.remove("visible");
        els.dotPoint2.removeAttribute("style");
      }

      return geometry;
    }

    function prepareDotActor() {
      const cursorBox = localBox(els.cursor);
      const refBox = referenceRect();
      const target = positionStaticDots().third;
      const startX = cursorBox.left;
      const startY = refBox.top;

      els.dotTail.style.left = `${startX}px`;
      els.dotTail.style.top = `${startY}px`;
      els.dotTail.style.width = `${cursorBox.width}px`;
      els.dotTail.style.height = `${refBox.height}px`;
      els.dotTail.style.borderRadius = "0px";
      els.dotTail.style.transformOrigin = "0% 100%";
      els.dotTail.style.transform = "rotate(0deg) scale(1, 1)";
      els.dotTail.style.opacity = "1";
      els.dotTail.classList.add("visible");

      els.dotActor.style.left = `${startX}px`;
      els.dotActor.style.top = `${target.top}px`;
      els.dotActor.style.width = `${target.size}px`;
      els.dotActor.style.height = `${target.size}px`;
      els.dotActor.style.borderRadius = `${target.size}px`;
      els.dotActor.style.transform = "rotate(0deg) scale(0.18, 0.18)";
      els.dotActor.style.opacity = "0";
      els.dotActor.classList.add("visible");

      return {
        startX,
        startY,
        width: cursorBox.width,
        height: refBox.height,
        targetLeft: target.left,
        targetTop: target.top,
        targetCenterX: target.centerX,
        targetCenterY: target.centerY,
        targetSize: target.size
      };
    }

    async function toppleCursorRight(startX, startY, width, height) {
      const pivotX = startX;
      const pivotY = startY + height;
      const finalTop = startY + height - width;

      els.dotTail.style.left = `${pivotX}px`;
      els.dotTail.style.top = `${finalTop}px`;
      els.dotTail.style.width = `${height}px`;
      els.dotTail.style.height = `${width}px`;
      els.dotTail.style.borderRadius = `${width}px`;
      els.dotTail.style.transformOrigin = "0% 100%";
      els.dotTail.style.transform = "rotate(-90deg)";

      await animateProgress(HERO_TIMING.cursorToppleDuration, function (progress) {
        let angle;

        if (progress < 0.74) {
          angle = -90 + 102 * easeInCubic(progress / 0.74);
        } else if (progress < 0.9) {
          angle = 12 - 18 * easeOutQuad((progress - 0.74) / 0.16);
        } else {
          angle = -6 + 6 * easeOutCubic((progress - 0.9) / 0.1);
        }

        els.dotTail.style.transformOrigin = "0% 100%";
        els.dotTail.style.transform = `rotate(${angle}deg)`;
      });

      els.dotTail.style.left = `${pivotX}px`;
      els.dotTail.style.top = `${finalTop}px`;
      els.dotTail.style.width = `${height}px`;
      els.dotTail.style.height = `${width}px`;
      els.dotTail.style.borderRadius = `${width}px`;
      els.dotTail.style.transformOrigin = "0% 50%";
      els.dotTail.style.transform = "rotate(0deg)";

      return {
        left: pivotX,
        right: pivotX + height,
        top: finalTop,
        bottom: pivotY,
        length: height,
        thickness: width
      };
    }

    function lockBallToDot(left, top, size) {
      els.dotActor.style.left = `${left}px`;
      els.dotActor.style.top = `${top}px`;
      els.dotActor.style.width = `${size}px`;
      els.dotActor.style.height = `${size}px`;
      els.dotActor.style.borderRadius = `${size}px`;
      els.dotActor.style.opacity = "1";
      els.dotActor.style.transform = "rotate(0deg) scale(1, 1)";
    }

    function lockActorToTarget(left, top, size) {
      lockBallToDot(left, top, size);
    }

    async function curlTailIntoBall(fallen, targetSize) {
      const ballStartSize = fallen.thickness;
      const baselineY = fallen.bottom;
      const ballLeft = fallen.left;

      els.dotTail.style.left = `${fallen.left}px`;
      els.dotTail.style.top = `${fallen.top}px`;
      els.dotTail.style.width = `${fallen.length}px`;
      els.dotTail.style.height = `${fallen.thickness}px`;
      els.dotTail.style.borderRadius = `${fallen.thickness}px`;
      els.dotTail.style.transformOrigin = "0% 50%";
      els.dotTail.style.transform = "rotate(0deg)";
      els.dotTail.style.opacity = "1";

      els.dotActor.style.left = `${ballLeft}px`;
      els.dotActor.style.top = `${baselineY - ballStartSize}px`;
      els.dotActor.style.width = `${ballStartSize}px`;
      els.dotActor.style.height = `${ballStartSize}px`;
      els.dotActor.style.borderRadius = `${targetSize}px`;
      els.dotActor.style.opacity = "1";
      els.dotActor.style.transform = "rotate(0deg) scale(1, 1)";

      await animateProgress(HERO_TIMING.cursorCurlDuration, function (progress) {
        const curlProgress = easeInCubic(progress);
        const size = ballStartSize + (targetSize - ballStartSize) * curlProgress;
        const ballTop = baselineY - size;
        const tangentX = ballLeft + size / 2;
        const lineTop = baselineY - fallen.thickness;
        const right = lerp(fallen.right, tangentX, curlProgress);

        els.dotActor.style.left = `${ballLeft}px`;
        els.dotActor.style.top = `${ballTop}px`;
        els.dotActor.style.width = `${size}px`;
        els.dotActor.style.height = `${size}px`;
        els.dotActor.style.borderRadius = `${targetSize}px`;
        els.dotActor.style.opacity = "1";

        els.dotTail.style.left = `${tangentX}px`;
        els.dotTail.style.top = `${lineTop}px`;
        els.dotTail.style.width = `${Math.max(right - tangentX, 0)}px`;
        els.dotTail.style.height = `${fallen.thickness}px`;
        els.dotTail.style.opacity = "1";
      });

      lockBallToDot(fallen.left, baselineY - targetSize, targetSize);
      els.dotTail.style.left = `${ballLeft + targetSize / 2}px`;
      els.dotTail.style.top = `${baselineY - fallen.thickness}px`;
      els.dotTail.style.width = "0px";
      els.dotTail.style.height = `${fallen.thickness}px`;
      els.dotTail.style.opacity = "1";
      els.dotTail.style.transform = "rotate(0deg)";

      return { x: fallen.left, y: baselineY - targetSize, size: targetSize };
    }

    async function squashBall(left, top, size, stretch, duration) {
      await animateProgress(duration, function () {
        els.dotActor.style.left = `${left - (size * stretch - size) / 2}px`;
        els.dotActor.style.top = `${top + (size - size / stretch) / 2}px`;
        els.dotActor.style.width = `${size * stretch}px`;
        els.dotActor.style.height = `${size / stretch}px`;
        els.dotActor.style.transform = "rotate(0deg) scale(1, 1)";
      });
    }

    async function unsquashBall(left, top, size, stretch, duration) {
      await animateProgress(duration, function (progress) {
        const eased = easeOutCubic(progress);
        const width = lerp(size * stretch, size, eased);
        const height = lerp(size / stretch, size, eased);
        els.dotActor.style.left = `${left - (width - size) / 2}px`;
        els.dotActor.style.top = `${top + (size - height) / 2}px`;
        els.dotActor.style.width = `${width}px`;
        els.dotActor.style.height = `${height}px`;
        els.dotActor.style.transform = "rotate(0deg) scale(1, 1)";
      });
    }

    async function bounceArc(startX, startY, endX, endY, peakY, duration, size) {
      const lift = Math.max(startY, endY) - peakY;

      await animateProgress(duration, function (_, raw) {
        const x = lerp(startX, endX, easeOutCubic(raw));
        const y = lerp(startY, endY, raw) - 4 * lift * raw * (1 - raw);
        els.dotActor.style.left = `${x}px`;
        els.dotActor.style.top = `${y}px`;
        els.dotActor.style.width = `${size}px`;
        els.dotActor.style.height = `${size}px`;
        els.dotActor.style.transform = "rotate(0deg) scale(1, 1)";
      });
    }

    async function bounceBallToAnchor(startCenterX, startCenterY, size, targetCenterX, targetCenterY) {
      const startX = startCenterX - size / 2;
      const startY = startCenterY - size / 2;
      const targetX = targetCenterX - size / 2;
      const targetY = targetCenterY - size / 2;
      const firstLandingX = startX + (targetX - startX) * 0.68;
      const firstLandingY = targetY + size * 0.24;
      const firstPeakY = targetY - size * 1.82;
      const secondPeakY = targetY - size * 1.08;

      lockBallToDot(startX, startY, size);
      await bounceArc(startX, startY, firstLandingX, firstLandingY, firstPeakY, HERO_TIMING.firstBounceDuration, size);
      await squashBall(firstLandingX, firstLandingY, size, 1.14, 130);
      await unsquashBall(firstLandingX, firstLandingY, size, 1.14, 120);
      await bounceArc(firstLandingX, firstLandingY, targetX, targetY, secondPeakY, HERO_TIMING.secondBounceDuration, size);
      await squashBall(targetX, targetY, size, 1.06, 90);
      await unsquashBall(targetX, targetY, size, 1.06, 120);
      lockBallToDot(targetX, targetY, size);
    }

    async function typeDots(activeSequence) {
      revealNode(heroState.streamNodes[heroState.streamNodes.length - 2]);
      heroState.visibleDotCount = 1;
      positionStaticDots();
      syncCursorGeometry();
      showCursor();
      await sleep(320);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      revealNode(heroState.streamNodes[heroState.streamNodes.length - 1]);
      heroState.visibleDotCount = 2;
      positionStaticDots();
      syncCursorGeometry();
      showCursor();
    }

    function nextTypeDelay(lastChar) {
      return lastChar === " " ? 260 : 188;
    }

    async function runTypingFlow(activeSequence) {
      let commaPausePending = false;

      for (let index = 0; index < currentText().length; index += 1) {
        if (activeSequence !== heroState.sequenceId) {
          return;
        }

        const lastChar = currentText()[index];
        revealNode(heroState.streamNodes[index]);

        if (commaPausePending && (lastChar === " " || lastChar === "\n")) {
          hideCursor();
          await sleep(220);
          if (activeSequence !== heroState.sequenceId) {
            return;
          }
          await blinkCursor(1, false);
          await sleep(HERO_TIMING.settleDelay);
          if (activeSequence !== heroState.sequenceId) {
            return;
          }
          showCursor();
          await sleep(200);
          commaPausePending = false;
          continue;
        }

        if (lastChar === ",") {
          commaPausePending = true;
        }

        showCursor();
        await sleep(nextTypeDelay(lastChar));
      }

      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      await typeDots(activeSequence);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      await runFinalDotSequence(activeSequence);
    }

    async function runFinalDotSequence(activeSequence) {
      await blinkCursor(1, false, HERO_TIMING.postDotBlinkDuration);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }
      await sleep(HERO_TIMING.postDotPause);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }
      await nextFrame();
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      const setup = prepareDotActor();
      hideCursor();
      const fallen = await toppleCursorRight(setup.startX, setup.startY, setup.width, setup.height);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }
      await sleep(HERO_TIMING.cursorTopplePause);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      const curled = await curlTailIntoBall(fallen, setup.targetSize);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      await bounceBallToAnchor(
        curled.x + curled.size / 2,
        curled.y + curled.size / 2,
        curled.size,
        setup.targetCenterX,
        setup.targetCenterY
      );
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      els.dotTail.classList.remove("visible");
      els.dotTail.removeAttribute("style");
      els.finalDot.classList.add("pending");
      lockActorToTarget(setup.targetLeft, setup.targetTop, setup.targetSize);
      els.dotActor.classList.add("visible");
      els.openDetailArrow.classList.add("visible");
      heroState.animationComplete = true;
      heroState.settled = true;
    }

    function revealCompleteText() {
      buildTypingNodes();
      syncMeasureLine();
      for (const node of heroState.streamNodes) {
        revealNode(node);
      }
      heroState.visibleDotCount = 2;
      els.finalDot.classList.add("pending");
    }

    function settleFinalDot() {
      hideCursor();
      const target = positionStaticDots().third;
      els.finalDot.classList.add("pending");
      els.dotTail.classList.remove("visible");
      els.dotTail.removeAttribute("style");
      lockActorToTarget(target.left, target.top, target.size);
      els.dotActor.classList.add("visible");
      els.openDetailArrow.classList.add("visible");
      syncCursorGeometry();
    }

    async function startTypingSequence() {
      heroState.sequenceId += 1;
      const activeSequence = heroState.sequenceId;
      heroState.animationComplete = false;
      heroState.settled = false;

      clearText();
      await sleep(HERO_TIMING.introDelay);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      await blinkCursor(2, false);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      showCursor();
      await sleep(HERO_TIMING.settleDelay);
      if (activeSequence !== heroState.sequenceId) {
        return;
      }

      await runTypingFlow(activeSequence);
    }

    const heroController = {
      start: startTypingSequence,
      restart: function () {
        heroState.sequenceId += 1;
        return startTypingSequence();
      },
      settle: function () {
        revealCompleteText();
        settleFinalDot();
        heroState.animationComplete = true;
        heroState.settled = true;
      },
      cancel: function () {
        heroState.sequenceId += 1;
      },
      isSettled: function () {
        return heroState.settled;
      }
    };

    function stopDetailMotion() {
      if (detailState.motion) {
        detailState.motion.cancel();
        detailState.motion = null;
      }
      if (detailState.heroMotion) {
        detailState.heroMotion.cancel();
        detailState.heroMotion = null;
      }
    }

    function animateDetail(opening) {
      stopDetailMotion();

      const detailDuration = opening ? 760 : 360;
      const detailTiming = opening
        ? { duration: detailDuration, delay: 300, easing: "cubic-bezier(0.22, 1, 0.36, 1)", fill: "forwards" }
        : { duration: detailDuration, delay: 0, easing: "cubic-bezier(0.7, 0, 0.84, 0)", fill: "forwards" };

      detailState.motion = els.detailLayer.animate(
        opening
          ? [{ transform: "translateY(100%)" }, { transform: "translateY(0)" }]
          : [{ transform: "translateY(0)" }, { transform: "translateY(100%)" }],
        detailTiming
      );

      detailState.heroMotion = els.heroCopy.animate(
        opening
          ? [
              { transform: "scale(1)", opacity: 1 },
              { transform: "scale(0.965)", opacity: 0.72, offset: 0.45 },
              { transform: "scale(0.88)", opacity: 0.18 }
            ]
          : [
              { transform: "scale(0.88)", opacity: 0.18 },
              { transform: "scale(0.955)", opacity: 0.68, offset: detailDuration / (detailDuration + 300) },
              { transform: "scale(1)", opacity: 1 }
            ],
        {
          duration: detailDuration + 300,
          delay: 0,
          easing: "linear",
          fill: "forwards"
        }
      );

      return {
        detailMotion: detailState.motion,
        heroMotion: detailState.heroMotion
      };
    }

    function showDetail(trigger) {
      if (document.body.classList.contains("detail-open") && !document.body.classList.contains("detail-closing")) {
        return;
      }

      detailState.returnFocus = trigger || document.activeElement;
      detailState.openedAt = performance.now();
      setContactExpanded(!compactContactMedia.matches);
      document.body.classList.add("transition-active");
      document.body.classList.remove("detail-closing");
      document.body.classList.add("detail-open");
      els.detailLayer.setAttribute("aria-hidden", "false");

      const motions = animateDetail(true);
      motions.detailMotion.onfinish = function () {
        els.detailLayer.style.transform = "translateY(0)";
        document.body.classList.remove("transition-active");
        detailState.motion = null;
      };
      motions.heroMotion.onfinish = function () {
        els.heroCopy.style.transform = "scale(0.88)";
        els.heroCopy.style.opacity = 0.18;
        detailState.heroMotion = null;
      };

      els.languageToggle.focus();
    }

    function hideDetail(event) {
      if (event) {
        event.stopPropagation();
      }
      if (event && event.type === "click" && performance.now() - detailState.openedAt < 420) {
        return;
      }
      if (!document.body.classList.contains("detail-open")) {
        return;
      }

      document.body.classList.add("transition-active");
      document.body.classList.remove("detail-open");
      document.body.classList.add("detail-closing");

      const motions = animateDetail(false);
      motions.detailMotion.onfinish = function () {
        els.detailLayer.style.transform = "translateY(100%)";
        els.detailLayer.setAttribute("aria-hidden", "true");
        document.body.classList.remove("detail-closing");
        document.body.classList.remove("transition-active");
        detailState.motion = null;

        if (heroController.isSettled()) {
          nextFrame().then(function () {
            heroController.settle();
          });
        }

        if (detailState.returnFocus) {
          detailState.returnFocus.focus();
        }
      };
      motions.heroMotion.onfinish = function () {
        els.heroCopy.style.transform = "scale(1)";
        els.heroCopy.style.opacity = 1;
        detailState.heroMotion = null;
      };
    }

    function handleDetailLayerClick(event) {
      if (event.target === els.detailLayer) {
        detailController.close(event);
      }
    }

    const detailController = {
      open: showDetail,
      close: hideDetail,
      isOpen: function () {
        return document.body.classList.contains("detail-open");
      }
    };

    function wireEvents() {
      els.openDetailArea.addEventListener("click", function (event) {
        detailController.open(event.currentTarget);
      });
      els.openDetailArea.addEventListener("keydown", function (event) {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          detailController.open(event.currentTarget);
        }
      });
      els.openDetailArrow.addEventListener("click", function (event) {
        event.stopPropagation();
        detailController.open(event.currentTarget);
      });
      els.closeDetailArrow.addEventListener("click", detailController.close);
      els.detailLayer.addEventListener("click", handleDetailLayerClick);
      els.contactMore.addEventListener("click", function (event) {
        event.stopPropagation();
        setContactExpanded(!els.contactIcons.classList.contains("expanded"));
      });
      els.langEn.addEventListener("click", function (event) {
        chooseDetailLanguage("en", event);
      });
      els.langZh.addEventListener("click", function (event) {
        chooseDetailLanguage("zh", event);
      });
      els.themeToggle.addEventListener("click", toggleSiteTheme);
      themeMedia.addEventListener("change", function () {
        if (!siteState.siteTheme) {
          applySiteTheme("");
        }
      });
      document.addEventListener("keydown", function (event) {
        if (event.key === "Escape") {
          detailController.close(event);
        }
      });
      window.addEventListener("resize", async function () {
        syncResponsiveControls();

        if (
          document.body.classList.contains("detail-open")
          || document.body.classList.contains("detail-closing")
          || document.body.classList.contains("transition-active")
        ) {
          return;
        }

        const wasComplete = heroController.isSettled();
        heroController.cancel();

        if (wasComplete) {
          heroController.settle();
          return;
        }

        await nextFrame();
        heroController.restart();
      });
    }

    function syncHomeAfterFontsReady() {
      fitIntroTitle();

      if (
        document.body.classList.contains("detail-open")
        || document.body.classList.contains("detail-closing")
        || document.body.classList.contains("transition-active")
      ) {
        return;
      }

      if (heroController.isSettled()) {
        heroController.settle();
        return;
      }

      clearText();
      heroController.start();
    }

    function startPage() {
      applyDetailLanguage(siteState.detailLanguage);
      syncResponsiveControls();
      applySiteTheme(siteState.siteTheme);
      wireEvents();
      clearText();
      window.setTimeout(function () {
        heroController.start();
      }, 120);
      document.fonts.ready.then(syncHomeAfterFontsReady);
    }

    startPage();
  </script>
</body>
